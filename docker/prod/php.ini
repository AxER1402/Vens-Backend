; =============================================================================
; php.ini — Ajustes de PHP para PRODUCCIÓN
; Centro Médico de Flebología — Vens
; =============================================================================
; Se carga como zz-vens.ini para que quede después de los .ini de las
; extensiones y sus valores ganen.
;
; La diferencia con docker/php/php.ini (desarrollo) está en dos puntos:
;   - Los errores no se muestran al usuario, se escriben al log.
;   - OPcache deja de comprobar si los archivos cambiaron: en producción el
;     código no cambia hasta el siguiente despliegue, y esa comprobación es
;     un stat() por archivo en cada petición.
; =============================================================================

; ── Límites ──────────────────────────────────────────────────────────────────
; Generar un informe de historia clínica en PDF o Word puede ser lento.
max_execution_time = 300
max_input_time     = 300
memory_limit       = 512M

; ── Subida de archivos ───────────────────────────────────────────────────────
; upload_max_filesize debe ser menor que post_max_size, y post_max_size debe
; coincidir con client_max_body_size de nginx.conf.
file_uploads        = On
upload_max_filesize = 20M
post_max_size       = 25M
max_file_uploads    = 10

; ── Zona horaria ─────────────────────────────────────────────────────────────
date.timezone = America/Guatemala

; ── Errores ──────────────────────────────────────────────────────────────────
; Nunca mostrar errores al usuario: un stack trace de PHP filtra rutas del
; servidor, credenciales de conexión y estructura de la base de datos.
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /dev/stderr
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── OPcache ──────────────────────────────────────────────────────────────────
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files   = 20000

; 0 = no revalidar nunca. El código solo cambia al reconstruir la imagen,
; y al reconstruirla el contenedor arranca de cero con la caché vacía.
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0

; ── Varios ───────────────────────────────────────────────────────────────────
; No anunciar la versión de PHP en la cabecera X-Powered-By.
expose_php = Off

mbstring.language = Neutral
