# =============================================================================
# nginx.conf — Servidor único: SPA de React + API de Laravel
# Centro Médico de Flebología — Vens (producción)
# =============================================================================
# Un solo dominio, un solo puerto, un solo certificado TLS.
#
#   /api/...      → Laravel (PHP-FPM en 127.0.0.1:9000)
#   /up           → ruta de salud de Laravel (la usa el HEALTHCHECK)
#   /storage/...  → archivos subidos desde la aplicación (logo del membrete)
#   /img/...      → imágenes que vienen con el repositorio del backend
#                   (isotipo.png y la plantilla del mapeo venoso, que los
#                    generadores de PDF y Word resuelven con public_path())
#   todo lo demás → la SPA, con fallback a index.html para React Router
#
# El orden importa: las rutas de Laravel usan el modificador "^~", que en
# Nginx gana sobre cualquier location por expresión regular. Así ninguna
# petición a /api termina cayendo en el fallback de la SPA.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # La raíz por defecto es la SPA; las locations de Laravel la reescriben.
    root  /var/www/spa;
    index index.html;

    # Debe coincidir con post_max_size de php.ini, o Nginx cortaría la subida
    # antes de que PHP llegara a verla.
    client_max_body_size 25M;

    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Cabeceras de seguridad. Se heredan a las locations que no declaren
    # ningún add_header propio (por eso más abajo se usa solo "expires").
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ─────────────────────────────────────────────────────────────────────────
    # LARAVEL — API
    # ─────────────────────────────────────────────────────────────────────────
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    # Ruta de salud (bootstrap/app.php la registra como health: '/up')
    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # LARAVEL — archivos
    # ─────────────────────────────────────────────────────────────────────────
    # Lo que sube el usuario. El alias apunta al disco 'public' de Laravel,
    # que es el volumen persistente montado en docker-compose.prod.yml.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Imágenes versionadas junto al backend (isotipo del membrete, plantilla
    # del mapeo venoso). Viven en el public/ de Laravel, no en la SPA.
    location ^~ /img/ {
        root /var/www/html/public;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # PHP-FPM
    # ─────────────────────────────────────────────────────────────────────────
    # A esta location solo se llega por redirección interna desde los
    # try_files de arriba: no hay ningún .php alcanzable directamente desde
    # fuera salvo el front controller de Laravel.
    location ~ \.php$ {
        root /var/www/html/public;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # Los informes en PDF y Word de historias clínicas pueden tardar.
        fastcgi_read_timeout    300;
        fastcgi_send_timeout    300;
        fastcgi_connect_timeout 60;

        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SPA
    # ─────────────────────────────────────────────────────────────────────────
    # Vite pone un hash en el nombre de cada archivo de assets/, así que el
    # contenido de una URL nunca cambia y se puede cachear un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # index.html NO se cachea: es el archivo que apunta a los assets con hash.
    # Si el navegador se quedara con uno viejo, seguiría cargando la versión
    # anterior de la aplicación después de cada despliegue.
    # Un add_header dentro de una location descarta los del bloque server,
    # así que las cabeceras de seguridad se repiten aquí: index.html es
    # justamente el documento donde más falta hacen.
    location = /index.html {
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control          "no-cache, must-revalidate"       always;
    }

    # Cualquier otra ruta la resuelve React Router en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos, salvo el directorio que usa Certbot para validar
    # los certificados de Let's Encrypt.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
