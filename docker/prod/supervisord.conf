; =============================================================================
; supervisord.conf — Los dos procesos de la imagen unificada
; Centro Médico de Flebología — Vens
; =============================================================================
; Un contenedor Docker vive mientras viva su proceso principal. Como aquí
; hacen falta dos (Nginx y PHP-FPM), el proceso principal es Supervisor, que
; los arranca, los vigila y los reinicia si alguno se cae.
;
; Todos los logs se redirigen a la salida estándar del contenedor, que es
; donde Docker los espera:
;   docker compose -f docker-compose.prod.yml logs -f app
; =============================================================================

[supervisord]
nodaemon = true
user     = root
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /run/supervisord.pid

; ── PHP-FPM ──────────────────────────────────────────────────────────────────
; Arranca primero (priority menor) para que ya esté escuchando en el puerto
; 9000 cuando Nginx empiece a reenviarle peticiones.
[program:php-fpm]
command  = php-fpm --nodaemonize --force-stderr
priority = 10
autostart   = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command  = nginx -g "daemon off;"
priority = 20
autostart   = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── Worker de colas (desactivado) ────────────────────────────────────────────
; El proyecto tiene QUEUE_CONNECTION=redis pero todavía no hay ningún Job en
; app/Jobs, así que no hay nada que procesar. Cuando se agregue el primero
; (por ejemplo, mandar los correos de recuperación de contraseña en segundo
; plano en vez de bloquear la petición), basta con poner autostart = true.
;
; --max-time=3600 hace que el worker se reinicie cada hora: es la forma
; recomendada de evitar que un proceso PHP de larga vida acumule memoria.
[program:queue-worker]
command  = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory = /var/www/html
user     = www-data
priority = 30
autostart   = false
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
