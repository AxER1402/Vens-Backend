# =============================================================================
# Nginx — Configuración del servidor web para Laravel
# Centro Médico de Flebología — Backend Vens
# =============================================================================
# Este archivo configura Nginx como servidor web proxy inverso.
# Nginx recibe las peticiones HTTP entrantes y las reenvía a PHP-FPM
# (el contenedor "app") para que Laravel las procese.
#
# Flujo de una petición:
#   Cliente → Nginx (puerto 8000) → PHP-FPM (puerto 9000) → Laravel → Respuesta
#
# Comando de recarga de config (sin reiniciar):
#   docker-compose exec nginx nginx -s reload
# =============================================================================

server {
    # ── Puerto de escucha ─────────────────────────────────────────────────────
    # Nginx escuchará peticiones en el puerto 80 dentro del contenedor.
    # Docker mapeará este puerto 80 al puerto 8000 de tu máquina local.
    # Acceso: http://localhost:8000
    listen 80;

    # ── Nombre del servidor ───────────────────────────────────────────────────
    # En desarrollo usamos localhost.
    # En producción cambiar por el dominio real (ej: api.vens-medico.com)
    server_name localhost;

    # ── Directorio raíz ───────────────────────────────────────────────────────
    # Laravel sirve todos los archivos públicos desde /public.
    # NUNCA exponer el directorio raíz de Laravel (contiene .env, vendor/, etc.)
    root /var/www/html/public;

    # ── Archivo índice ────────────────────────────────────────────────────────
    # Laravel usa index.php como punto de entrada único (patrón Front Controller).
    # Todas las rutas pasan por este archivo.
    index index.php index.html index.htm;

    # ── Tamaño máximo del cuerpo de la petición ───────────────────────────────
    # Debe coincidir o ser mayor que post_max_size en php.ini.
    # Necesario para subir documentos clínicos e imágenes.
    client_max_body_size 25M;

    # ── Logs ──────────────────────────────────────────────────────────────────
    # Los logs se envían a stdout/stderr para que Docker los capture.
    # Ver logs: docker-compose logs nginx
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    # Buenas prácticas de seguridad HTTP para sistemas médicos.
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Regla principal de enrutamiento ──────────────────────────────────────
    # Esta es la regla más importante para que Laravel funcione.
    #
    # Orden de búsqueda de cada petición:
    #   1. ¿Existe el archivo exacto en /public? → Servirlo directamente
    #      (ej: /storage/fotos/imagen.jpg → sirve el archivo)
    #   2. ¿Existe como directorio? → Buscar index dentro
    #   3. Si no existe → Redirigir a index.php (Laravel maneja la ruta)
    #      (ej: /api/pacientes → Laravel::route('/api/pacientes'))
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Procesamiento de archivos PHP ─────────────────────────────────────────
    # Cuando Nginx encuentra un archivo .php, no lo procesa directamente.
    # Lo reenvía a PHP-FPM via el protocolo FastCGI.
    location ~ \.php$ {
        # Reenviar al contenedor PHP-FPM.
        # "app" es el nombre del servicio en docker-compose.yml.
        # Docker resuelve automáticamente "app" a la IP del contenedor.
        fastcgi_pass   app:9000;

        # Archivo que se ejecutará (index.php en la mayoría de casos)
        fastcgi_index  index.php;

        # Variables estándar de FastCGI
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeouts para procesos larguos (generación de reportes, etc.)
        fastcgi_read_timeout  300;
        fastcgi_send_timeout  300;
        fastcgi_connect_timeout 60;

        # Buffer para respuestas grandes
        fastcgi_buffer_size          128k;
        fastcgi_buffers              4 256k;
        fastcgi_busy_buffers_size    256k;
    }

    # ── Archivos estáticos ─────────────────────────────────────────────────────
    # Para assets estáticos (CSS, JS, imágenes) usamos caché del navegador
    # y evitamos registrar cada acceso en los logs de Nginx.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|svg|woff|woff2|ttf|eot)$ {
        expires     30d;
        add_header  Cache-Control "public, no-transform";
        access_log  off;
    }

    # ── Bloquear acceso a archivos ocultos ────────────────────────────────────
    # Protege archivos como .env, .git, .htaccess de ser accedidos públicamente.
    # Crítico para la seguridad del sistema médico.
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Storage público de Laravel ────────────────────────────────────────────
    # Laravel almacena archivos públicos en storage/app/public.
    # Se acceden via /storage/ gracias al symlink creado con:
    #   php artisan storage:link
    location /storage {
        alias /var/www/html/storage/app/public;
        try_files $uri $uri/ =404;
    }
}
