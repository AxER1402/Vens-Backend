; =============================================================================
; php.ini — Configuración personalizada de PHP para Laravel
; Centro Médico de Flebología — Backend Vens
; =============================================================================
; Este archivo sobreescribe configuraciones por defecto de PHP.
; Se aplica automáticamente al iniciar el contenedor PHP-FPM.
; Ubicación dentro del contenedor: /usr/local/etc/php/conf.d/custom.ini
; =============================================================================

; ── Configuración General ─────────────────────────────────────────────────────

; Tiempo máximo de ejecución de un script PHP (en segundos).
; Aumentado para procesos médicos complejos (exportación de reportes, etc.)
max_execution_time = 300

; Tiempo máximo de espera para recibir datos de entrada (formularios grandes)
max_input_time = 300

; Memoria máxima que puede usar un script PHP.
; 512MB es adecuado para procesar imágenes médicas y reportes extensos.
memory_limit = 512M

; ── Subida de Archivos ────────────────────────────────────────────────────────

; Habilitar la subida de archivos (para documentos y fotos de pacientes)
file_uploads = On

; Tamaño máximo de un archivo individual subido.
; 20MB permite subir imágenes de ultrasonidos, ecografías vasculares, etc.
upload_max_filesize = 20M

; Tamaño máximo del cuerpo total de una petición POST.
; Debe ser >= upload_max_filesize.
post_max_size = 25M

; Número máximo de archivos que se pueden subir en una sola petición.
max_file_uploads = 10

; ── Zona Horaria ──────────────────────────────────────────────────────────────

; Zona horaria por defecto para el servidor.
; Guatemala: UTC-6 (America/Guatemala, sin horario de verano)
date.timezone = America/Guatemala

; ── Errores y Depuración (Desarrollo) ─────────────────────────────────────────

; En desarrollo: mostrar errores para facilitar la depuración.
; IMPORTANTE: En producción cambiar display_errors = Off
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /var/log/php_errors.log

; Nivel de reporte de errores: reportar todo excepto notices estrictos
error_reporting = E_ALL

; ── OPcache — Caché de Bytecode ───────────────────────────────────────────────
; OPcache mejora significativamente el rendimiento al cachear el bytecode
; compilado de PHP, evitando recompilar los archivos en cada petición.

; Activar OPcache
opcache.enable = 1

; Activar OPcache para CLI (útil para comandos Artisan)
opcache.enable_cli = 1

; Memoria reservada para el caché (en MB)
opcache.memory_consumption = 128

; Memoria para strings internados
opcache.interned_strings_buffer = 8

; Número máximo de archivos en caché
opcache.max_accelerated_files = 10000

; Frecuencia de revalidación del caché (en segundos).
; En desarrollo: 0 = revalidar en cada petición (no cachear)
; En producción: 60 = revalidar cada minuto
opcache.revalidate_freq = 0

; ── Seguridad ─────────────────────────────────────────────────────────────────

; Ocultar la versión de PHP en cabeceras HTTP (seguridad)
expose_php = Off

; Nombre de la cookie de sesión
SESSION_COOKIE=vens_session

; ── Extensiones de Cadenas ────────────────────────────────────────────────────

; Codificación de mbstring
; Nota: mbstring.internal_encoding fue deprecado en PHP 8.2+
; Usar mb_internal_encoding() en el código cuando sea necesario
mbstring.language = Neutral
