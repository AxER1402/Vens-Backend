; =============================================================================
; supervisord.conf — Los tres procesos del contenedor de DESARROLLO
; Centro Médico de Flebología — Vens
; =============================================================================
; Un contenedor vive mientras viva su proceso principal. Aquí hacen falta
; tres, así que el principal es Supervisor, que los arranca y los revive si
; alguno se cae.
;
; Todos los logs salen juntos por:
;   make logs-app
; y se pueden separar por proceso con:
;   make logs-vite
; =============================================================================

[supervisord]
nodaemon = true
user     = root
logfile  = /dev/null
logfile_maxbytes = 0
pidfile  = /run/supervisord.pid

; ── PHP-FPM ──────────────────────────────────────────────────────────────────
[program:php-fpm]
command  = php-fpm --nodaemonize --force-stderr
priority = 10
autostart   = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── Vite ─────────────────────────────────────────────────────────────────────
; Corre como www-data para que lo que escriba en node_modules/ y en la caché
; de Vite quede con el mismo dueño que el resto de los archivos montados.
;
; startsecs = 10 porque Vite tarda un poco en levantar; sin ese margen,
; Supervisor lo daría por caído y lo reintentaría en bucle.
[program:vite]
command   = npm run dev
directory = /app
user      = www-data
environment = HOME="/home/www-data",NPM_CONFIG_CACHE="/home/www-data/.npm"
priority  = 20
autostart   = true
autorestart = true
startsecs   = 10
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; ── Nginx ────────────────────────────────────────────────────────────────────
; Arranca el último: para entonces PHP-FPM y Vite ya escuchan y no hay
; ventana en la que el navegador reciba un 502.
[program:nginx]
command  = nginx -g "daemon off;"
priority = 30
autostart   = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
