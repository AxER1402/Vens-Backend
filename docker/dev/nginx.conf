# =============================================================================
# nginx.conf — Un solo servidor para el frontend y la API (DESARROLLO)
# Centro Médico de Flebología — Vens
# =============================================================================
#   /api/...      → Laravel (PHP-FPM en 127.0.0.1:9000)
#   /up           → ruta de salud de Laravel
#   /storage/...  → archivos subidos (logo del membrete)
#   /img/...      → imágenes del public/ de Laravel
#   todo lo demás → el servidor de desarrollo de Vite (127.0.0.1:5173)
#
# La diferencia clave con docker/prod/nginx.conf: aquí la SPA no se sirve
# como archivos, se hace de PROXY hacia Vite. Vite sigue vigilando los
# archivos montados por volumen, así que la recarga en caliente funciona
# exactamente igual que cuando el frontend tenía su propio contenedor.
# =============================================================================

# Vite mantiene abierto un WebSocket para avisar al navegador de cada cambio.
# Este map traduce la cabecera Upgrade de la petición al valor que necesita
# Connection: sin él, el WebSocket no se establece y la recarga en caliente
# deja de funcionar (la página cargaría, pero habría que refrescar a mano).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name localhost;

    client_max_body_size 25M;
    charset utf-8;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ─────────────────────────────────────────────────────────────────────────
    # LARAVEL
    # ─────────────────────────────────────────────────────────────────────────
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location ^~ /img/ {
        root /var/www/html/public;
        try_files $uri =404;
    }

    location ~ \.php$ {
        root /var/www/html/public;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        fastcgi_read_timeout    300;
        fastcgi_send_timeout    300;
        fastcgi_connect_timeout 60;

        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # VITE
    # ─────────────────────────────────────────────────────────────────────────
    # Todo lo que no sea de Laravel va al servidor de desarrollo de React:
    # index.html, los .jsx sin compilar, /@vite/client y el WebSocket de HMR.
    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite manda los módulos a medida que los transforma; con buffering
        # activo Nginx los retendría y el arranque se vería más lento.
        proxy_buffering off;

        # El WebSocket de HMR queda abierto mientras dure la sesión de trabajo.
        # Con el timeout por defecto (60s) se cortaría y habría que refrescar.
        proxy_read_timeout 86400;
    }
}
