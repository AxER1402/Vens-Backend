# =============================================================================
# docker-compose.yml — Orquestación de servicios Docker
# Centro Médico de Flebología — Backend Vens
# =============================================================================
# Este archivo define y conecta TODOS los servicios del entorno de desarrollo.
# Es el archivo principal que Docker Compose usa para levantar el stack completo.
#
# Comandos principales:
#   docker-compose up -d          # Levantar todos los servicios en background
#   docker-compose down           # Detener y eliminar contenedores
#   docker-compose down -v        # Detener y eliminar contenedores + volúmenes
#   docker-compose ps             # Ver estado de todos los contenedores
#   docker-compose logs -f        # Ver logs en tiempo real de todos los servicios
#   docker-compose logs -f app    # Ver logs solo del servicio PHP/Laravel
#   docker-compose restart app    # Reiniciar un servicio específico
# =============================================================================

# =============================================================================
# SERVICIOS
# Cada "service" es un contenedor Docker independiente.
# Se comunican entre sí a través de la red interna "vens_network".
# =============================================================================
services:

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: app (PHP 8.3 FPM + Laravel)
  # ────────────────────────────────────────────────────────────────────────────
  # Este es el núcleo del backend. Ejecuta el código PHP de Laravel.
  # NO es directamente accesible desde el exterior; Nginx actúa como proxy.
  #
  # Para ejecutar comandos dentro de este contenedor:
  #   docker-compose exec app bash           # Abrir terminal interactiva
  #   docker-compose exec app php artisan <cmd>  # Ejecutar comando Artisan
  #   docker-compose exec app composer <cmd>     # Ejecutar Composer
  app:
    # Construir la imagen usando nuestro Dockerfile personalizado.
    # context: directorio base para el build (donde se buscan los COPY)
    # dockerfile: ruta al Dockerfile dentro del context
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        # Pasamos el UID/GID del usuario actual para evitar problemas de permisos
        # $(id -u) y $(id -g) devuelven el ID del usuario actual del sistema
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    # Nombre del contenedor (para referenciarlo con docker ps o docker logs)
    container_name: vens_app

    # Directorio de trabajo dentro del contenedor
    working_dir: /var/www/html

    # Volúmenes: mapean directorios de tu máquina local al contenedor.
    # Formato: "ruta_local:ruta_en_contenedor"
    # El primer volumen sincroniza el código fuente en tiempo real.
    # Cambios en ./src/ se reflejan inmediatamente en el contenedor.
    volumes:
      # Código fuente de Laravel ← mapea a /var/www/html en el contenedor
      - ./src:/var/www/html
      # Volumen nombrado para vendor/ (mejor rendimiento en Mac)
      # Sin esto, el directorio vendor/ es muy lento en Docker Desktop para Mac
      - vendor_data:/var/www/html/vendor

    # Variables de entorno del contenedor (cargadas desde el archivo .env)
    environment:
      - PHP_FPM_USER=www-data
      - PHP_FPM_GROUP=www-data

    # Política de reinicio: reiniciar automáticamente si el contenedor falla
    restart: unless-stopped

    # Red interna a la que pertenece este servicio
    networks:
      - vens_network

    # Dependencias: "app" espera a que "mysql" y "redis" estén saludables
    # antes de arrancar.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: nginx (Servidor Web)
  # ────────────────────────────────────────────────────────────────────────────
  # Nginx actúa como servidor web y proxy inverso.
  # Recibe peticiones HTTP del exterior y las reenvía al servicio "app" (PHP-FPM).
  #
  # Acceso: http://localhost:8000
  # Logs:   docker-compose logs -f nginx
  nginx:
    # Usamos la imagen oficial de Nginx (versión Alpine = más liviana)
    image: nginx:1.25-alpine

    container_name: vens_nginx

    # Mapeo de puertos: "puerto_local:puerto_contenedor"
    # Tu máquina:8000 → Contenedor Nginx:80
    ports:
      - "${NGINX_PORT:-8000}:80"

    volumes:
      # Código fuente (Nginx necesita acceso a /public para servir assets)
      - ./src:/var/www/html:ro         # :ro = read-only (Nginx no escribe)
      # Configuración personalizada de Nginx
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Logs de Nginx (para diagnóstico)
      - nginx_logs:/var/log/nginx

    restart: unless-stopped

    networks:
      - vens_network

    depends_on:
      - app

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: mysql (Base de Datos)
  # ────────────────────────────────────────────────────────────────────────────
  # MySQL 8.0 como motor de base de datos.
  # Almacena toda la información del sistema médico:
  # pacientes, citas, consultas, diagnósticos, etc.
  #
  # Conexión desde tu máquina: mysql -h 127.0.0.1 -P 3306 -u vens_user -p
  # Desde phpMyAdmin:          http://localhost:8080
  # Logs:                      docker-compose logs -f mysql
  mysql:
    # Imagen oficial de MySQL 8.0
    image: mysql:8.0

    container_name: vens_mysql

    # Puerto expuesto al exterior (para conectar con clientes MySQL locales)
    ports:
      - "${DB_PORT:-3306}:3306"

    # Variables de entorno para configurar MySQL al iniciar por primera vez.
    # Estas variables son leídas por el script de inicialización de MySQL.
    environment:
      # Contraseña del usuario root (administrador de MySQL)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_vens_2024}
      # Nombre de la base de datos que se creará automáticamente
      MYSQL_DATABASE: ${DB_DATABASE:-vens_flebologia}
      # Usuario de la aplicación (Laravel usará este usuario, NO root)
      MYSQL_USER: ${DB_USERNAME:-vens_user}
      # Contraseña del usuario de la aplicación
      MYSQL_PASSWORD: ${DB_PASSWORD:-vens_password_2024}
      # Zona horaria de MySQL
      TZ: America/Guatemala

    # Configuración adicional de MySQL
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO

    # Volúmenes para persistencia de datos.
    # Sin esto, los datos se pierden al eliminar el contenedor.
    volumes:
      # Datos de MySQL persistidos en un volumen nombrado Docker
      - mysql_data:/var/lib/mysql
      # Scripts SQL de inicialización (se ejecutan solo la primera vez)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    restart: unless-stopped

    networks:
      - vens_network

    # Healthcheck: verifica que MySQL esté listo para aceptar conexiones.
    # Docker Compose espera a que este check pase antes de iniciar "app".
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_vens_2024}"]
      interval: 10s    # Verificar cada 10 segundos
      timeout: 5s      # Timeout de 5 segundos por verificación
      retries: 5       # Intentar 5 veces antes de marcar como unhealthy
      start_period: 30s # Esperar 30s antes del primer check (MySQL tarda en iniciar)

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: redis (Caché y Colas)
  # ────────────────────────────────────────────────────────────────────────────
  # Redis es una base de datos en memoria muy rápida.
  # En Laravel lo usamos para:
  #   - Caché de consultas frecuentes (listas de médicos, catálogos)
  #   - Gestión de sesiones
  #   - Colas de trabajos (jobs): envío de emails, notificaciones, reportes
  #   - Rate limiting en la API
  #
  # Monitoreo: docker-compose exec redis redis-cli monitor
  redis:
    # Imagen oficial de Redis (versión Alpine = más liviana)
    image: redis:7.2-alpine

    container_name: vens_redis

    # Puerto Redis (normalmente no exponer en producción)
    ports:
      - "${REDIS_PORT:-6379}:6379"

    # Configuración de Redis: habilitamos persistencia AOF (Append Only File)
    # Esto guarda los datos en disco para no perderlos si el contenedor reinicia.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_vens_2024}

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - vens_network

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: phpmyadmin (Administrador de Base de Datos)
  # ────────────────────────────────────────────────────────────────────────────
  # Interfaz web para gestionar la base de datos MySQL visualmente.
  # Permite ver tablas, ejecutar SQL, importar/exportar datos, etc.
  #
  # Acceso: http://localhost:8080
  #   - Usuario: vens_user  (o root para acceso completo)
  #   - Contraseña: vens_password_2024
  #
  # NOTA: Solo para desarrollo. No incluir en producción.
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: vens_phpmyadmin

    ports:
      - "${PMA_PORT:-8080}:80"

    environment:
      # Servidor MySQL al que se conecta (nombre del contenedor en Docker)
      PMA_HOST: vens_mysql
      # Puerto de MySQL
      PMA_PORT: 3306
      # Usuario y contraseña para inicio de sesión automático directo (sin pedir contraseña)
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_vens_2024}
      # Tamaño máximo de import de archivos SQL
      UPLOAD_LIMIT: 50M
      # Zona horaria de la interfaz
      TZ: America/Guatemala

    restart: unless-stopped

    networks:
      - vens_network

    depends_on:
      mysql:
        condition: service_healthy

# =============================================================================
# VOLÚMENES NOMBRADOS
# Los volúmenes nombrados persisten datos entre reinicios de contenedores.
# Son gestionados por Docker y almacenados en el sistema Docker del host.
#
# Listar volúmenes:  docker volume ls
# Inspeccionar:      docker volume inspect vens_mysql_data
# Eliminar todo:     docker-compose down -v  (¡CUIDADO! Borra los datos)
# =============================================================================
volumes:
  # Datos de MySQL (registros de pacientes, citas, etc.)
  mysql_data:
    name: vens_mysql_data

  # Datos de Redis (caché y colas)
  redis_data:
    name: vens_redis_data

  # Dependencias de PHP/Composer (mejora rendimiento en Mac)
  vendor_data:
    name: vens_vendor_data

  # Logs de Nginx
  nginx_logs:
    name: vens_nginx_logs

# =============================================================================
# REDES
# Todos los servicios comparten la red "vens_network".
# Esto permite que se comuniquen entre sí usando su nombre de servicio como host.
# Ejemplo: desde "app", conectarse a MySQL usando el host "mysql" (no 127.0.0.1)
#
# Listar redes: docker network ls
# Inspeccionar: docker network inspect vens_network
# =============================================================================
networks:
  vens_network:
    name: vens_network
    driver: bridge
