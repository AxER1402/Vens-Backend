# =============================================================================
# docker-compose.yml — Orquestación de servicios Docker (DESARROLLO)
# Centro Médico de Flebología — Vens
# =============================================================================
# Un solo comando levanta TODO: el frontend, el backend y la base de datos.
# Ya no hay que arrancar el contenedor del frontend por separado desde el otro
# repositorio: Vite corre dentro del mismo contenedor que Laravel.
#
#   app          Nginx + PHP-FPM + Vite  →  http://localhost:8000
#   mysql        Base de datos
#   redis        Caché, sesiones y colas
#   phpmyadmin   Administrador visual de la BD  →  http://localhost:8080
#
# TODO se abre en http://localhost:8000 — la pantalla y la API comparten
# dirección. El puerto 5173 ya no se usa.
#
# Comandos principales (o sus atajos: make up, make down, make logs...):
#   docker-compose up -d          # Levantar todo
#   docker-compose down           # Detener y eliminar contenedores
#   docker-compose down -v        # ...y además borrar los volúmenes
#   docker-compose ps             # Ver estado
#   docker-compose logs -f app    # Ver logs de Nginx, PHP y Vite juntos
# =============================================================================

services:

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: app (Nginx + PHP 8.4 FPM + Laravel + Vite/React)
  # ────────────────────────────────────────────────────────────────────────────
  # La aplicación completa en un contenedor. Dentro corre Supervisor, que
  # mantiene vivos tres procesos:
  #
  #   Nginx    :80    reparte: /api va a PHP, el resto va a Vite
  #   PHP-FPM  :9000  Laravel (solo interno)
  #   Vite     :5173  servidor de desarrollo de React (solo interno)
  #
  # El código de los dos repositorios entra por volúmenes, así que se sigue
  # editando desde el Mac con recarga en caliente. Reconstruir la imagen solo
  # hace falta si cambia el Dockerfile o la configuración de PHP/Nginx.
  #
  # Para ejecutar comandos dentro:
  #   docker-compose exec app bash               # Terminal
  #   docker-compose exec app php artisan <cmd>  # Artisan
  #   docker-compose exec app composer <cmd>     # Composer
  #   docker-compose exec -w /app app npm <cmd>  # npm (el frontend vive en /app)
  app:
    build:
      # El contexto es ./docker porque la imagen necesita tanto dev/ (su
      # propia configuración) como php/php.ini, que se comparte con el resto.
      context: ./docker
      dockerfile: dev/Dockerfile
      args:
        # UID/GID del usuario del Mac, para que los archivos que genere el
        # contenedor (vendor/, node_modules/, cachés) no queden de otro dueño.
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    container_name: vens_app

    working_dir: /var/www/html

    ports:
      # Una sola puerta de entrada para la pantalla y la API.
      - "${NGINX_PORT:-8000}:80"

    volumes:
      # ── Backend ──
      # Código de Laravel ← se edita desde el Mac y se refleja al instante
      - ./src:/var/www/html
      # vendor/ en un volumen con nombre: dentro de un directorio montado
      # desde el Mac, Composer y el autoloader van muy lentos.
      - vendor_data:/var/www/html/vendor
      # La plantilla de configuración del proyecto, que vive fuera de src/.
      # El entrypoint la usa para crear src/.env en el primer arranque.
      #
      # Se monta en /opt/vens y no dentro de /var/www/html porque ese
      # directorio ya es un bind mount de ./src: Docker no puede crear un
      # punto de montaje dentro de otro montaje del host.
      - ./.env.example:/opt/vens/env.example:ro

      # ── Frontend ──
      # Código de React, que vive en el repositorio de al lado.
      - ../Frontend-Vens:/app
      # node_modules/ también en volumen con nombre, por la misma razón:
      # es la diferencia entre que Vite arranque en segundos o en minutos.
      - node_modules_data:/app/node_modules

    environment:
      - PHP_FPM_USER=www-data
      - PHP_FPM_GROUP=www-data
      # Solo para el mensaje de bienvenida del arranque.
      - NGINX_PORT=${NGINX_PORT:-8000}
      # Vite necesita sondear los archivos para enterarse de los cambios:
      # las notificaciones del sistema de archivos no cruzan de macOS al
      # contenedor, así que sin esto la recarga en caliente no se dispara.
      - CHOKIDAR_USEPOLLING=true

    restart: unless-stopped

    networks:
      - vens_network

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: mysql (Base de Datos)
  # ────────────────────────────────────────────────────────────────────────────
  # MySQL 8.0 como motor de base de datos.
  # Almacena toda la información del sistema médico:
  # pacientes, citas, consultas, diagnósticos, etc.
  #
  # Conexión desde tu máquina: mysql -h 127.0.0.1 -P 3306 -u vens_user -p
  # Desde phpMyAdmin:          http://localhost:8080
  # Logs:                      docker-compose logs -f mysql
  mysql:
    image: mysql:8.0

    container_name: vens_mysql

    ports:
      - "${DB_PORT:-3306}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_vens_2024}
      MYSQL_DATABASE: ${DB_DATABASE:-vens_flebologia}
      MYSQL_USER: ${DB_USERNAME:-vens_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vens_password_2024}
      TZ: America/Guatemala

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    restart: unless-stopped

    networks:
      - vens_network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_vens_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: redis (Caché y Colas)
  # ────────────────────────────────────────────────────────────────────────────
  # Redis es una base de datos en memoria muy rápida.
  # En Laravel lo usamos para:
  #   - Caché de consultas frecuentes (listas de médicos, catálogos)
  #   - Gestión de sesiones
  #   - Colas de trabajos (jobs): envío de emails, notificaciones, reportes
  #   - Rate limiting en la API
  #
  # Monitoreo: docker-compose exec redis redis-cli monitor
  redis:
    image: redis:7.2-alpine

    container_name: vens_redis

    ports:
      - "${REDIS_PORT:-6379}:6379"

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_vens_2024}

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - vens_network

  # ────────────────────────────────────────────────────────────────────────────
  # SERVICIO: phpmyadmin (Administrador de Base de Datos)
  # ────────────────────────────────────────────────────────────────────────────
  # Interfaz web para gestionar la base de datos MySQL visualmente.
  # Permite ver tablas, ejecutar SQL, importar/exportar datos, etc.
  #
  # Acceso: http://localhost:8080
  #
  # NOTA: Solo para desarrollo. No se despliega en producción
  # (ver docker-compose.prod.yml).
  phpmyadmin:
    image: phpmyadmin:latest

    container_name: vens_phpmyadmin

    ports:
      - "${PMA_PORT:-8080}:80"

    environment:
      PMA_HOST: vens_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_vens_2024}
      UPLOAD_LIMIT: 50M
      TZ: America/Guatemala

    restart: unless-stopped

    networks:
      - vens_network

    depends_on:
      mysql:
        condition: service_healthy

# =============================================================================
# VOLÚMENES NOMBRADOS
# Los volúmenes nombrados persisten datos entre reinicios de contenedores.
#
# Listar volúmenes:  docker volume ls
# Inspeccionar:      docker volume inspect vens_mysql_data
# Eliminar todo:     docker-compose down -v  (¡CUIDADO! Borra los datos)
# =============================================================================
volumes:
  # Datos de MySQL (registros de pacientes, citas, etc.)
  mysql_data:
    name: vens_mysql_data

  # Datos de Redis (caché y colas)
  redis_data:
    name: vens_redis_data

  # Dependencias de PHP/Composer (mejora rendimiento en Mac)
  vendor_data:
    name: vens_vendor_data

  # Dependencias de Node/npm del frontend (misma razón)
  node_modules_data:
    name: vens_node_modules_data

# =============================================================================
# REDES
# Todos los servicios comparten la red "vens_network".
# Esto permite que se comuniquen entre sí usando su nombre de servicio como host.
# Ejemplo: desde "app", conectarse a MySQL usando el host "mysql" (no 127.0.0.1)
# =============================================================================
networks:
  vens_network:
    name: vens_network
    driver: bridge
